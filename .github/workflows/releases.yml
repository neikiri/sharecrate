name: Create Missing Releases
'on':
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  create-releases:
    name: Create Missing Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create missing GitHub Releases
        env:
          GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -e

          REPO="${{ github.repository }}"
          VERSION_REGEX='^[0-9]+\.[0-9]+\.[0-9]+$'

          echo "Fetching tags..."
          git fetch --tags --force

          echo "Collecting tags in x.x.x format..."
          ALL_TAGS=$(git tag --list --sort=version:refname | grep -E "$VERSION_REGEX" || true)

          if [ -z "$ALL_TAGS" ]; then
            echo "No tags matching x.x.x found."
            exit 0
          fi

          echo "Processing tags..."

          for TAG in $ALL_TAGS; do
            echo ""
            echo "Checking tag: $TAG"

            if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
              echo "✔ Release already exists"
              continue
            fi

            echo "Finding changelog entry in CHANGELOG.md..."

            # Escape dots so the tag is matched literally, not as a regex wildcard.
            ESCAPED_TAG=$(printf '%s' "$TAG" | sed 's/\./\\./g')

            # CHANGELOG.md entries look like:
            #   ## [1.0.0] - 2026-07-31
            #
            #   ### Added
            #   - ...
            # We drop the "## [x.x.x] - date" header (GitHub already shows the tag as the
            # release title) and keep everything below it up to the next "## [" entry.
            CHANGELOG=$(awk -v tag="$ESCAPED_TAG" '
              $0 ~ "^## \\[" tag "\\]" { found=1; next }
              /^## \[/ && found { exit }
              found {
                if (!started && $0 == "") next
                started=1
                print
              }
            ' CHANGELOG.md)

            if [ -z "$CHANGELOG" ]; then
              echo "⚠ No changelog entry found for $TAG"
              CHANGELOG="No changelog entry available."
            fi

            PREVIOUS_TAG=$(printf '%s\n' "$ALL_TAGS" | awk -v tag="$TAG" '
                $0 == tag { print prev; exit }
                { prev = $0 }
              ')

            if [ -n "$PREVIOUS_TAG" ]; then
              CHANGELOG=$(printf "%s\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s" \
                "$CHANGELOG" "$REPO" "$PREVIOUS_TAG" "$TAG")
            else
              CHANGELOG=$(printf "%s\n\n**Full Changelog**: https://github.com/%s/commits/%s" \
                "$CHANGELOG" "$REPO" "$TAG")
            fi

            echo "Creating release $TAG..."

            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --notes "$CHANGELOG"

            echo "✔ Release created"
          done

          echo ""
          echo "Done."
